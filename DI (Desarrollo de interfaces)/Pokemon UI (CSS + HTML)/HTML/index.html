<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <title>Lista de Pokémons</title>
</head>
<body class="bg-light">

  <div class="container my-4">
    <h1 class="text-center mb-4">Pokémons</h1>

    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-4">

      <div class="col">
        <div class="card h-100 text-center shadow-sm">
          <div class="card-body">
            <small class="text-muted">25</small>
            <br>
            <a href="https://pokemondb.net/pokedex/pikachu"><img src="https://img.pokemondb.net/sprites/black-white/anim/normal/pikachu-f.gif" alt="Pikachu"></a>
            <h1 class="card-title">Pikachu</h1>
            <span class="badge text-bg-warning">Eléctrico</span>
            <span class="badge text-bg-secondary">Normal</span>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100 text-center shadow-sm">
          <div class="card-body">
            <small class="text-muted">001</small>
            <h2 class="card-title">Bulbasaur</h2>
            <span class="badge text-bg-success">Planta</span>
            <span class="badge text-bg-danger">Veneno</span>
            <span class="badge text-bg-secondary">Normal</span>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100 text-center shadow-sm">
          <div class="card-body">
            <small class="text-muted">004</small>
            <h3 class="card-title">Charmander</h3>
            <span class="badge text-bg-danger">Fuego</span>
            <span class="badge text-bg-secondary">Normal</span>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100 text-center shadow-sm">
          <div class="card-body">
            <small class="text-muted">007</small>
            <h4 class="card-title">Squirtle</h4>
            <span class="badge text-bg-primary">Agua</span>
            <span class="badge text-bg-secondary">Normal</span>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100 text-center shadow-sm">
          <div class="card-body">
            <small class="text-muted">150</small>
            <h5 class="card-title">Mewtwo</h5>
            <span class="badge text-bg-secondary">Psíquico</span>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100 text-center shadow-sm">
          <div class="card-body">
            <small class="text-muted">143</small>
            <h6 class="card-title">Snorlax</h6>
            <span class="badge text-bg-secondary">Normal</span>
          </div>
        </div>
      </div>

      <div class="col">
        <div class="card h-100 text-center shadow-sm">
          <div class="card-body">
            <small class="text-muted">144</small>
            <br>
            <a href="https://pokemondb.net/pokedex/zekrom"><img src="https://img.pokemondb.net/sprites/black-white/anim/shiny/zekrom.gif" alt="Zekrom"></a>
            <h5 class="card-title">Zekrom</h5>
            <span class="badge text-bg-warning">Eléctrico</span>
            <span class="badge text-bg-secondary">Normal</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
