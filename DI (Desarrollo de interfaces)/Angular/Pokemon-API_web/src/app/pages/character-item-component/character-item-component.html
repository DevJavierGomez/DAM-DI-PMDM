<section class="card" style="max-width: 320px;">
  <img [src]="`https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/${getCharacterId()}.png`"
  class="card-img-top">
  <div class="card-body">
    <h4 class="card-title">{{ Pokemon()?.name }}</h4>
    <p class="card-text">{{ Pokemon()?.url }}</p>
    <button type="button" class="btn-solid theme-primary" (click)="emitCharacterClicked()">Ver detalles</button>
  </div>
</section>
