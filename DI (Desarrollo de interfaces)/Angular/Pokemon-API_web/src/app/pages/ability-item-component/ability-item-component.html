<div class="tw:h-full tw:rounded-xl tw:border tw:border-gray-200 tw:bg-white tw:p-4 tw:shadow-sm tw:flex tw:flex-col tw:justify-between">
  <div>
    <span class="tw:inline-block tw:rounded-md tw:bg-gray-600 tw:px-2.5 tw:py-0.5 tw:text-xs tw:font-semibold tw:text-white tw:mb-2">
      #{{ getAbilityId() }}
    </span>
    <h5 class="tw:text-lg tw:font-bold tw:capitalize tw:text-gray-900">
      {{ ability()?.name }}
    </h5>
  </div>

  <button
    class="tw:mt-4 tw:w-full tw:rounded-lg tw:bg-blue-600 tw:px-4 tw:py-2 tw:text-sm tw:font-medium tw:text-white hover:tw:bg-blue-700"
    (click)="ViewDetails()">
    Ver detalle
  </button>
</div>
